<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Earnings | LA Core</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#071827;color:#f6f8fb;font:16px system-ui;margin:0;padding:22px}main{max-width:840px;margin:auto}a{color:#f4c542}h1{color:#f4c542}section{background:#102b3e;padding:20px;border-radius:14px;margin:18px 0}label{display:block;margin:12px 0 4px}input,select,button{padding:11px;border-radius:8px;border:1px solid #496071;font:inherit;max-width:100%}input,select{background:#081c2b;color:white;width:100%}button{background:#f4c542;color:#071827;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #375064;text-align:left}small{color:#b5c3cd}.hidden{display:none}.msg{margin:12px 0;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}</style></head><body><main><p><a href="crew.html">← Time Clock</a></p><h1>My Earnings</h1><p>Your private project earnings and recorded payments. Amounts are estimates, not final payroll statements.</p><div id="msg" class="msg"></div><section id="loginBox"><label>Your name</label><select id="employee"></select><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"><button id="login">Unlock Earnings</button></section><section id="changeBox" class="hidden"><h2>Create Your Private PIN</h2><p>Temporary access detected. Choose a new six-digit PIN. You'll sign in again using the new PIN.</p><label>New PIN</label><input id="newPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button id="savePin">Save Private PIN</button></section><div id="earnings" class="hidden"><button id="logout">Lock Earnings</button><div id="projects"></div></div></main><script>
const db=supabase.createClient('https://cftnybwpiqmovugcbpgf.supabase.co','sb_publishable_-V5oytvKBz4DaqK7S42PCw_jSXepNkH'),$=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0);let token=null;
function msg(t){$('msg').textContent=t}
async function init(){const {data,error}=await db.rpc('crew_active_employees');if(error){msg('Employee list unavailable: '+error.message);return}for(const e of data||[]){const id=e.employee_id||e.id,name=e.full_name||e.name;if(id&&name)$('employee').add(new Option(name,id))}if(!$('employee').options.length)msg('No employees available. Contact the owner.')}
async function showEarnings(){const {data,error}=await db.rpc('crew_private_earnings',{p_token:token});if(error){msg(error.message);$('earnings').classList.add('hidden');return}const wrap=$('projects');wrap.replaceChildren();let earned=0,paid=0;for(const p of data||[]){earned+=Number(p.estimated_earned)||0;paid+=Number(p.paid)||0;const s=document.createElement('section'),h=document.createElement('h2');h.textContent=p.project;s.append(h);for(const line of ['Hours: '+p.hours,'Estimated earned: '+money(p.estimated_earned),'Payments recorded: '+money(p.paid),'Estimated remaining: '+money(p.estimated_balance)]){const d=document.createElement('p');d.textContent=line;s.append(d)}const title=document.createElement('h3');title.textContent='Payment History';s.append(title);for(const pay of p.payments||[]){const d=document.createElement('p');d.textContent=pay.date+' · '+pay.method+' · '+money(pay.amount)+(pay.reference?' · '+pay.reference:'');s.append(d)}wrap.append(s)}const total=document.createElement('section');total.textContent='All projects · Estimated earned: '+money(earned)+' · Payments recorded: '+money(paid)+' · Estimated remaining: '+money(earned-paid);wrap.prepend(total);$('loginBox').classList.add('hidden');$('changeBox').classList.add('hidden');$('earnings').classList.remove('hidden');msg('Private earnings unlocked.')}
$('login').onclick=async()=>{const pin=$('pin').value.trim();if(!/^\d{6}$/.test(pin)){msg('Enter a six-digit PIN.');return}const {data,error}=await db.rpc('crew_pin_login',{p_employee_id:$('employee').value,p_pin:pin});$('pin').value='';if(error||data?.error){msg('Unable to sign in. Check your PIN or ask the owner for a temporary PIN.');return}token=data.token;if(data.requires_pin_change){$('loginBox').classList.add('hidden');$('changeBox').classList.remove('hidden');msg('Please set your private PIN.')}else await showEarnings()};
$('savePin').onclick=async()=>{const pin=$('newPin').value.trim();if(!/^\d{6}$/.test(pin)){msg('Your new PIN must have six digits.');return}const {error}=await db.rpc('crew_set_private_pin',{p_token:token,p_new_pin:pin});$('newPin').value='';token=null;if(error){msg('PIN could not be saved: '+error.message);return}$('changeBox').classList.add('hidden');$('loginBox').classList.remove('hidden');msg('PIN saved. Sign in again with your new private PIN.')};
$('logout').onclick=()=>{token=null;$('earnings').classList.add('hidden');$('loginBox').classList.remove('hidden');$('projects').replaceChildren();msg('Earnings locked.')};init();</script></body></html>
